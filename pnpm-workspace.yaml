packages:
  - 'apps/tan-react'
  - 'packages/core'
  - 'packages/__tests__/project1'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

nodeLinker: hoisted
minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1
  vite-plus: 1.7.0
  '@vitest/coverage-v8': 5.1.1

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest

  allowedVersions:
    vite: '*'
    vitest: '*'
